<style>
  :root {
    color-scheme: light dark;
    --paper: #f6f1e8;
    --ink: #2b2620;
    --muted: #6d6357;
    --card: #fffdf8;
    --c-apps: #2e7d32;
    --c-comm: #6a3fb5;
    --c-res: #b26a00;
    --c-int: #c2452d;
    --c-web: #1f6fb2;
    --c-find: #5f574c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #171310;
      --ink: #ece4d8;
      --muted: #a89c8d;
      --card: #241d17;
      --c-apps: #7cc47f;
      --c-comm: #b394e8;
      --c-res: #e0a44a;
      --c-int: #e08064;
      --c-web: #6fa8dc;
      --c-find: #a89c8d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #map { width: 100%; height: 100%; display: block; }
  #map text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .blob { stroke-width: 2; fill-opacity: .09; stroke-opacity: .5; }
  .node { cursor: pointer; }
  .node.selected .blob { stroke-width: 4; stroke-opacity: .95; fill-opacity: .14; }
  .dtitle { font-size: 38px; font-weight: 700; }
  .detail { opacity: 1; }
  .item { font-size: 16px; fill: var(--ink); }
  .conn { fill: none; stroke: var(--muted); stroke-width: 2.5; stroke-dasharray: 1 7; stroke-linecap: round; opacity: .8; }
  .connlabel { font-size: 14px; font-style: italic; fill: var(--muted); }
  .plaza-ring { fill: none; stroke: var(--ink); stroke-width: 3; }
  .node.selected .plaza-ring { stroke-width: 6; }
  .plaza-name { font-size: 36px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
  .plaza-sub { font-size: 17px; fill: var(--muted); text-anchor: middle; }
  @media (max-width: 560px) {
    #srcref { display: none; }
  }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
    padding: .55rem .8rem;
    pointer-events: none;
  }
  header .brand { font-weight: 700; font-size: 1.05rem; pointer-events: auto; }
  header .brand span { font-weight: 400; font-size: .8rem; color: var(--muted); margin-left: .4rem; }
  header nav { display: flex; gap: .35rem; pointer-events: auto; }
  header button {
    font: inherit; font-size: .95rem; color: var(--ink);
    background: var(--card); border: 1px solid var(--muted);
    border-radius: .55rem; padding: .15rem .6rem; cursor: pointer; min-width: 2.2rem;
  }
  #hint {
    position: fixed; left: .8rem; bottom: .8rem; z-index: 4;
    font-size: .75rem; color: var(--muted);
  }
  #srcref {
    position: fixed; right: .8rem; bottom: .8rem; z-index: 4;
    font-size: .75rem; color: var(--muted);
  }
  #srcref a { color: var(--muted); }
  #card {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 2.2rem; z-index: 6;
    width: min(92vw, 34rem);
    background: var(--card); color: var(--ink);
    border: 1px solid var(--muted); border-radius: .9rem;
    padding: 1rem 1.1rem .9rem;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
  }
  #card[hidden] { display: none; }
  #card h2 { margin: 0 2rem .3rem 0; font-size: 1.15rem; }
  #card p { margin: 0 0 .6rem; font-size: .92rem; line-height: 1.5; }
  #card .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  #card .chips a {
    font-size: .82rem; text-decoration: none; color: var(--c-web);
    border: 1px solid currentColor; border-radius: 999px; padding: .18rem .7rem;
  }
  #card-close {
    position: absolute; top: .45rem; right: .6rem;
    font: inherit; font-size: 1.1rem; line-height: 1;
    background: none; border: none; color: var(--muted); cursor: pointer;
  }
</style>
</head>

    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) downAt = { x: e.clientX, y: e.clientY, t: Date.now(), el: e.target };
    if (pointers.size === 2) {
      var p = Array.from(pointers.values());
      pinch0 = { d: dist(p[0], p[1]), s: view.s };
    }
  });

  stage.addEventListener("pointermove", function (e) {
    if (!pointers.has(e.pointerId)) return;
    var prev = pointers.get(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      view.x += e.clientX - prev.x;
      view.y += e.clientY - prev.y;
      dirty = true;
      apply();
    } else if (pointers.size === 2 && pinch0) {
      var p = Array.from(pointers.values());
      var d = dist(p[0], p[1]);
      var mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      if (d > 0) zoomAt(mx, my, (pinch0.s * (d / pinch0.d)) / view.s);
    }
  });

  function endPointer(e) {
    var wasTap = false;
    if (pointers.size === 1 && downAt) {
      var dx = e.clientX - downAt.x, dy = e.clientY - downAt.y;
      wasTap = Math.hypot(dx, dy) < 8 && Date.now() - downAt.t < 500;
    }
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch0 = null;
    var tapEl = (downAt && downAt.el) || e.target;
    if (wasTap && tapEl && tapEl.closest) {
      var n = tapEl.closest(".node");
      if (n) select(n.getAttribute("data-node"));
    }
    if (pointers.size === 0) downAt = null;
  }
  stage.addEventListener("pointerup", endPointer);
  stage.addEventListener("pointercancel", endPointer);

  stage.addEventListener("wheel", function (e) {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });

  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  document.getElementById("zin").addEventListener("click", function () {
    var r = stage.getBoundingClientRect();
    zoomAt(r.width / 2, r.height / 2, 1.5);
  });
  document.getElementById("zout").addEventListener("click", function () {
    var r = stage.getBoundingClientRect();
    zoomAt(r.width / 2, r.height / 2, 1 / 1.5);
  });
  document.getElementById("zfit").addEventListener("click", fit);

  function select(id) {
    var d = DATA[id];
    if (!d) return;
    document.querySelectorAll(".node.selected").forEach(function (n) { n.classList.remove("selected"); });
    var node = document.querySelector('.node[data-node="' + id + '"]');
    if (node) node.classList.add("selected");
    document.getElementById("card-title").textContent = d.title;
    document.getElementById("card-desc").textContent = d.desc;
    var box = document.getElementById("card-links");
    box.textContent = "";
    d.links.forEach(function (l) {
      var a = document.createElement("a");
      a.textContent = l[0];
      a.href = l[1];
      a.target = "_blank";
      a.rel = "noopener";
      box.appendChild(a);
    });
    card.hidden = false;
    if (history.replaceState) history.replaceState(null, "", "#place=" + id);
  }

  function closeCard() {
    card.hidden = true;
    document.querySelectorAll(".node.selected").forEach(function (n) { n.classList.remove("selected"); });
    if (history.replaceState) history.replaceState(null, "", location.pathname + location.search);
  }
  document.getElementById("card-close").addEventListener("click", closeCard);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeCard(); });

  fit();
  window.addEventListener("resize", onResize);

  // shareable state: #place=apps, or ?z=2&cx=600&cy=400 for a framed view
  var q = new URLSearchParams(location.search);
  if (q.get("z")) {
    var cx = parseFloat(q.get("cx") || "600"), cy = parseFloat(q.get("cy") || "400");
    centerOn(cx, cy, parseFloat(q.get("z")));
  }
  var m = /place=(\w+)/.exec(location.hash || "");
  if (m) select(m[1]);
})();
</script>
</body>
</html>
