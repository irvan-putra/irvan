name: irvan signed release

# Manual only. Builds the release APK, signs it with the irvan key from repository secrets,
# verifies the signature and package, then publishes a GitHub pre-release with a direct APK link.
on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_CERT_SHA256: "7CAC2BFE2D751C7311181D372E1864B2325FF0E841AF49D3E186E1049D0A0B23"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Map asset is in sync with index.html
        run: python3 tools/build_map_asset.py --check
      - run: chmod +x ./gradlew
      - name: Read version
        id: v
        run: |
          VER=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test -n "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build and sign
        env:
          IRVAN_KEYSTORE_B64: ${{ secrets.IRVAN_KEYSTORE_B64 }}
          IRVAN_STORE_PASSWORD: ${{ secrets.IRVAN_STORE_PASSWORD }}
          IRVAN_KEY_ALIAS: ${{ secrets.IRVAN_KEY_ALIAS }}
          IRVAN_KEY_PASSWORD: ${{ secrets.IRVAN_KEY_PASSWORD }}
        run: |
          echo "$IRVAN_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/irvan.jks"
          export IRVAN_KEYSTORE_FILE="$RUNNER_TEMP/irvan.jks"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/irvan.jks"
      - name: Verify signature, package and permissions
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.v.outputs.version }}"
          APK="app/build/outputs/apk/release/irvan-v${VER}-release.apk"
          test -f "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          GOT=$(grep -m1 'certificate SHA-256 digest' /tmp/cert.txt | awk '{print toupper($NF)}')
          test "$GOT" = "$EXPECTED_CERT_SHA256"
          if "$BT/apksigner" verify --print-certs "$APK" | grep -q 'DEBUG'; then exit 1; fi
          if "$BT/aapt" dump permissions "$APK" | grep -q 'uses-permission'; then exit 1; fi
          cp "$APK" "irvan-v${VER}.apk"
          sha256sum "irvan-v${VER}.apk" | tee "irvan-v${VER}.apk.sha256"
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.v.outputs.version }}"
          cat > notes.md <<NOTES
          irvan ${VER}: the interactive world map from https://vanipy.com/irvan/ as an offline app screen - pinch to zoom, drag to pan, tap a place for its card. Map bundled in the app; no network, no permissions; card links open in the browser app. Signed with the irvan key (certificate SHA-256 ${EXPECTED_CERT_SHA256}).

          SHA-256 of the APK is in the attached .sha256 file.
          NOTES
          gh release create "v${VER}" "irvan-v${VER}.apk" "irvan-v${VER}.apk.sha256" \
            --title "irvan ${VER}" --notes-file notes.md --prerelease --target "${GITHUB_SHA}"
